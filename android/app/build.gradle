plugins {
    id 'com.android.application'
}

// Na GitHubie każde budowanie ma kolejny numer – używamy go jako numeru wersji.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'pl.zooolw.tuyapilot'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.zooolw.tuyapilot'
        // Android 8.0+ (java.util.Base64, kanały powiadomień, ikony adaptacyjne)
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Stały klucz podpisu: kolejne wersje instalują się jako aktualizacja.
    signingConfigs {
        shared {
            storeFile rootProject.file('tuya-pilot.keystore')
            storePassword 'tuyapilot'
            keyAlias 'tuyapilot'
            keyPassword 'tuyapilot'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
